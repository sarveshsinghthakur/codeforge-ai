root = "app"
backend_folder = "app"

[alembic]
script_location = app/migrations
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[[post_write_hooks.hooks.alembic.convert]]
# To auto-generate TypeScript types from Alembic, uncomment:
# import = "alembic"

[log]
level = INFO

[logger_file_handler]
class = FileHandler
level = INFO
formatter = generic
filename = logs/alembic.log

[[logger_handlers]]

[[loggers]]
[[loggers.loggers.alembic]]
level = INFO
handlers = [console, file_handler]
propagate = 0

[[loggers.loggers.root]]
level = WARN
handlers = [console]
propagate = 0

[run_migrations_online]
# URL overrides
url = postgresql://codeforge:codeforge@localhost:5432/codeforge
