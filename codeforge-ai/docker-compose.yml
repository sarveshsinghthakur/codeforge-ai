services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge
      POSTGRES_DB: codeforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://codeforge:codeforge@postgres:5432/codeforge
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://codeforge:codeforge@postgres:5432/codeforge
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info

  executor:
    build:
      context: ./backend/docker/executor
      dockerfile: Dockerfile
    privileged: false
    read_only: true
    tmpfs:
      - /tmp:size=100m
      - /run:size=10m
    cap_drop:
      - ALL
    pids_limit: 20
    memory: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges
    # No network access for execution sandbox
    network_mode: none

volumes:
  postgres_data:
