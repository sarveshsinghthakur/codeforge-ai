# Render blueprint: backend API (Python) + frontend static site.
# Create via Render Dashboard -> New -> Blueprint -> repo sarveshsinghthakur/codeforge-ai
services:
  - type: web
    name: codeforge-api
    runtime: python
    repo: https://github.com/sarveshsinghthakur/codeforge-ai
    rootDir: codeforge-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: codestral-2508
      - key: MISTRAL_FALLBACK_MODELS
        value: mistral-small-2603,ministral-8b-2512
      - key: CORS_ORIGINS
        value: https://codeforge-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

staticSites:
  - type: static
    name: codeforge-frontend
    repo: https://github.com/sarveshsinghthakur/codeforge-ai
    branch: main
    rootDir: codeforge-ai/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://codeforge-api.onrender.com
